AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Speedrun hall of fame for Vinay's portfolio (HTTP API, Lambda, DynamoDB)

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']   # tighten to your Amplify URL after deploy
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  Fn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /scores, Method: GET}
        Post:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /scores, Method: POST}
      InlineCode: |
        const {DynamoDBClient} = require('@aws-sdk/client-dynamodb');
        const {DynamoDBDocumentClient, ScanCommand, PutCommand} = require('@aws-sdk/lib-dynamodb');
        const db = DynamoDBDocumentClient.from(new DynamoDBClient({}));
        const T = process.env.TABLE;
        const res = (code, body) => ({statusCode: code, headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
        exports.handler = async (e) => {
          const method = e.requestContext.http.method;
          if (method === 'GET') {
            const r = await db.send(new ScanCommand({TableName: T}));
            const top = (r.Items || []).sort((a, b) => a.secs - b.secs).slice(0, 10).map(i => ({name: i.name, secs: i.secs}));
            return res(200, top);
          }
          let b;
          try { b = JSON.parse(e.body || '{}'); } catch { return res(400, {error: 'Invalid JSON'}); }
          const name = String(b.name || '').trim();
          const secs = Math.round(Number(b.secs));
          if (!/^[A-Za-z0-9 ]{2,12}$/.test(name) || !(secs >= 5 && secs <= 3600)) return res(400, {error: 'Invalid name or time'});
          try {
            await db.send(new PutCommand({
              TableName: T,
              Item: {pk: name.toLowerCase(), name, secs, ts: Date.now()},
              ConditionExpression: 'attribute_not_exists(pk) OR #s > :s',
              ExpressionAttributeNames: {'#s': 'secs'},
              ExpressionAttributeValues: {':s': secs}
            }));
          } catch (err) {
            if (err.name !== 'ConditionalCheckFailedException') throw err;
          }
          return res(200, {ok: true});
        };

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com